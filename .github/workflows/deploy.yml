name: CLIP Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy CLIP to Vultr
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          # key: ${{ secrets.SSH_KEY }}   # SSH 키를 사용한다면 password 대신 사용

          script: |
            # CLIP 프로젝트 최신 코드 가져오기
            cd ~/hanaem/CLIP
            git fetch origin
            git reset --hard origin/main

            # CLIP 컨테이너만 재빌드 및 재배포
            cd ~/hanaem
            docker compose build --no-cache clip
            docker compose up -d clip